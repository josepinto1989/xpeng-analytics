name: Bug report
description: Report a reproducible problem without sharing vehicle data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve XPENG Analytics.

        **Never attach an XPENG export, JSON.GZ history, VIN, location, screenshot with personal data, or browser storage dump.** Use synthetic or redacted examples only.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Chrome
        - Edge
        - Other / untested
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "Example: Firefox 145"
    validations:
      required: true
  - type: dropdown
    id: import-type
    attributes:
      label: What were you importing?
      options:
        - XPENG Data Act ZIP
        - XPENG Analytics JSON.GZ history
        - Nothing / interface problem
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence that triggers the problem. Do not include real vehicle data.
      placeholder: |
        1. Open the site
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not attached or pasted real vehicle exports, histories, VINs, locations, credentials, or other personal data.
          required: true
